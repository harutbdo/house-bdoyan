<svg viewBox="0 0 680 352" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif">
      <text x="0" y="13" font-size="9.5" letter-spacing="2" fill="#8E2C2C" font-weight="650">HOW A GERDASTAN WORKED</text>
      <text x="0" y="40" font-family="Cormorant Garamond" font-size="22" font-weight="600" fill="#2A2420">One roof, one hearth, three or four generations</text>
      <line x1="0" y1="54" x2="680" y2="54" stroke="#DCD2C2" stroke-width="1"/>
      <g stroke="#A9813F" stroke-width="1.4" fill="none" opacity=".85">
        <path d="M340 122 V140 M85 140 H595 M85 140 V152 M255 140 V152 M425 140 V152 M595 140 V152"/>
        <path d="M85 208 V222 M255 208 V222 M425 208 V222 M595 208 V222 M85 222 H595 M340 222 V232"/>
      </g>
      <rect x="225" y="68" width="230" height="54" rx="6" fill="#8E2C2C"/>
      <text x="340" y="92" text-anchor="middle" font-family="Cormorant Garamond" font-size="19" font-weight="700" fill="#F7E7C6">Tanuter &amp; Tantikin</text>
      <text x="340" y="110" text-anchor="middle" font-size="9.5" fill="#EBCB95">the eldest man and his wife · e.g. Bdo</text>
      <g text-anchor="middle">
        <rect x="10" y="152" width="150" height="56" rx="6" fill="#fff" stroke="#DCD2C2" stroke-width="1.2"/>
        <rect x="180" y="152" width="150" height="56" rx="6" fill="#fff" stroke="#DCD2C2" stroke-width="1.2"/>
        <rect x="350" y="152" width="150" height="56" rx="6" fill="#fff" stroke="#DCD2C2" stroke-width="1.2"/>
        <rect x="520" y="152" width="150" height="56" rx="6" fill="#fff" stroke="#DCD2C2" stroke-width="1.2"/>
        <g font-family="Cormorant Garamond" font-size="16.5" font-weight="700" fill="#2A2420">
          <text x="85" y="177">1st son + bride</text><text x="255" y="177">2nd son + bride</text><text x="425" y="177">3rd son + bride</text><text x="595" y="177">Younger sons</text>
        </g>
        <g font-size="9.5" fill="#7A6F64">
          <text x="85" y="196">married sons stay home</text><text x="255" y="196">brides (հարս) join the house</text><text x="425" y="196">all work the shared land</text><text x="595" y="196">until they marry</text>
        </g>
      </g>
      <rect x="10" y="232" width="660" height="40" rx="6" fill="#F4EDE1" stroke="#E6DBC8" stroke-width="1.2"/>
      <text x="340" y="258" text-anchor="middle" font-family="Cormorant Garamond" font-size="17" font-weight="700" fill="#2A2420">Grandchildren — the next generation of the house</text>
      <g font-size="10" fill="#4A423B">
        <text x="10" y="300" font-size="9" letter-spacing="1.6" font-weight="650" fill="#8E2C2C">SHARED</text>
        <text x="10" y="317">one hearth (թոնիր), one granary,</text><text x="10" y="331">one purse, common fields and flocks</text>
        <text x="245" y="300" font-size="9" letter-spacing="1.6" font-weight="650" fill="#8E2C2C">MOVEMENT</text>
        <text x="245" y="317">daughters marry out to other houses;</text><text x="245" y="331">brides marry in from other villages</text>
        <text x="480" y="300" font-size="9" letter-spacing="1.6" font-weight="650" fill="#8E2C2C">WHEN IT DIVIDED</text>
        <text x="480" y="317">every branch kept the founder’s</text><text x="480" y="331">name: “Bdo’s people”, the Bdoyans</text>
      </g>
    </svg>